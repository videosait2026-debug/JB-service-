  <style>
    /* Página "máscara": muestra la aplicación de Google Apps Script a pantalla completa con el dominio propio del negocio */
    :root { --marino: #0A1A3F; --azul: #1F5FE0; --celeste: #7DB4FF; }
    html, body { margin: 0; height: 100%; background: var(--marino); overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #F1F5F9; }
    #cargando {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(circle at 50% 35%, #163a8a 0, var(--marino) 65%); color: #fff; z-index: 2; transition: opacity .4s; text-align: center; padding: 16px;
    }
    #cargando img { width: 132px; height: 132px; object-fit: contain; border-radius: 22px; background: #fff; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    #cargando b { font-size: 20px; letter-spacing: 1.5px; }
    #cargando span { color: var(--celeste); font-size: 12px; font-weight: bold; letter-spacing: .6px; }
    .giro { width: 42px; height: 42px; border-radius: 50%; border: 5px solid rgba(255,255,255,.15); border-top-color: var(--azul); animation: g .9s linear infinite; }
    @keyframes g { to { transform: rotate(360deg); } }
    #cargando.listo { opacity: 0; pointer-events: none; }
  </style>
